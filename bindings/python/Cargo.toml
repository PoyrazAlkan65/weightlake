[package]
name = "wl-py"
description = "WeightLake Python bindings (native module weightlake._native)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
wl = { package = "weightlake", path = "../../crates/weightlake" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
