[workspace]
resolver = "2"
members = [
    "crates/wl-core",
    "crates/wl-store",
    "crates/wl-version",
    "crates/wl-io",
    "crates/wl-query",
    "crates/weightlake",
    "crates/wl-cli",
    "bindings/c",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wl-core = { path = "crates/wl-core" }
wl-store = { path = "crates/wl-store" }
wl-version = { path = "crates/wl-version" }
wl-io = { path = "crates/wl-io" }
wl-query = { path = "crates/wl-query" }
weightlake = { path = "crates/weightlake" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
postcard = { version = "1", features = ["alloc"] }
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zstd = "0.14"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 4
